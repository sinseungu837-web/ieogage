# 매일 1회 가격 DB 자동 보강: 헬로마켓(등록 출처) + 온비드 공매 낙찰가 → data/listings.csv
# 필요: GitHub 저장소 Settings → Secrets and variables → Actions 에 DATA_GO_KR_KEY, GEMINI_API_KEY 등록
name: collect-prices

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas python-dotenv
      - name: 헬로마켓 수집
        run: python crawler.py hellomarket --limit 12 || true
      - name: 온비드 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python crawler.py onbid || true
      - name: 제목에서 제조사·모델 추출
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pip install google-genai && python crawler.py enrich || true
      - name: 변경 시 커밋
        run: |
          git config user.name "price-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.csv data/price_table.csv
          git diff --cached --quiet || (git commit -m "data: 가격 DB 자동 수집 $(date +%F)" && git push)

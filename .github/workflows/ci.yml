# push·PR 마다 단위 테스트 (LLM·카카오 API 호출 없음, 키 불필요 — 외부 호출은 테스트에서 모두 mock)
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v

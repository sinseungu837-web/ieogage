<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { margin:0; font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:#171916; background:#f4f2eb; }
#surface { position:relative; width:100%; user-select:none; -webkit-user-select:none; }
img { display:block; width:100%; pointer-events:none; }
#surface.draw { touch-action:none; cursor:crosshair; }
#surface:not(.draw) { touch-action:pan-y; cursor:pointer; }
#box { position:absolute; box-sizing:border-box; border:3px solid #00b85c; background:#00e67622; pointer-events:none; display:none; }
#status { font-size:12px; line-height:1.65; color:#656861; margin:9px 0; }
</style></head>
<body><div id="surface" role="img" aria-label="집기 사진. 영역 선택 모드에서는 마우스나 손가락으로 드래그하세요."><img id="photo" alt="인식된 집기 사진" draggable="false"><div id="box"></div></div><p id="status" aria-live="polite"></p>
<script>
const surface = document.getElementById('surface'), photo = document.getElementById('photo'), box = document.getElementById('box'), status = document.getElementById('status');
let args = {}, start = null, pointer = null, selection = null, token, eventId = 0;
const send = (type, data = {}) => parent.postMessage({isStreamlitMessage:true,type,...data}, '*');
const height = () => send('streamlit:setFrameHeight', {height:document.body.scrollHeight});
function point(e) {
  const r = surface.getBoundingClientRect();
  return [Math.max(0, Math.min(1, (e.clientX-r.left)/r.width))*photo.naturalWidth,
          Math.max(0, Math.min(1, (e.clientY-r.top)/r.height))*photo.naturalHeight];
}
function paint(coords) {
  box.style.display = coords ? 'block' : 'none';
  if (!coords) return;
  const [x1,y1,x2,y2] = coords;
  Object.assign(box.style,{left:Math.min(x1,x2)/photo.naturalWidth*100+'%',top:Math.min(y1,y2)/photo.naturalHeight*100+'%',width:Math.abs(x2-x1)/photo.naturalWidth*100+'%',height:Math.abs(y2-y1)/photo.naturalHeight*100+'%'});
}
function emit(value) { send('streamlit:setComponentValue',{value:{...value,event_id:Date.now()+'-'+(++eventId)},dataType:'json'}); }
window.addEventListener('message', e => {
  if (e.data.type !== 'streamlit:render') return;
  args = e.data.args;
  if (token !== args.reset_token) { start = null; pointer = null; token = args.reset_token; }
  selection = args.pending_box;
  surface.classList.toggle('draw',args.mode === 'draw');
  status.textContent = args.mode === 'draw' ? 'PC: 마우스로 드래그 · 모바일: 손가락으로 드래그하여 물건을 감싸세요.' : '박스를 누르면 수정할 물건을 선택합니다. 모바일에서는 사진 위에서도 스크롤할 수 있습니다.';
  if (photo.getAttribute('src') !== args.image) photo.src = args.image;
  paint(selection); height();
});
photo.onload = () => { paint(selection); height(); };
new ResizeObserver(height).observe(surface);
surface.addEventListener('pointerdown',e => {
  if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
  start = point(e); pointer = e.pointerId;
  surface.setPointerCapture(pointer);
  if (args.mode === 'draw') { e.preventDefault(); paint([...start,...start]); }
});
surface.addEventListener('pointermove', e => {
  if (pointer !== e.pointerId || !start || args.mode !== 'draw') return;
  e.preventDefault(); paint([...start,...point(e)]);
});
surface.addEventListener('pointerup', e => {
  if (pointer !== e.pointerId || !start) return;
  const end = point(e), origin = start;
  start = null; pointer = null;
  surface.releasePointerCapture(e.pointerId);
  const r = surface.getBoundingClientRect();
  const dx = Math.abs(end[0]-origin[0])/photo.naturalWidth*r.width;
  const dy = Math.abs(end[1]-origin[1])/photo.naturalHeight*r.height;
  if (args.mode === 'draw') {
    if (dx < 5 || dy < 5) { paint(selection); return; }
    selection = [Math.min(origin[0],end[0]),Math.min(origin[1],end[1]),Math.max(origin[0],end[0]),Math.max(origin[1],end[1])];
    paint(selection); emit({kind:'box',box:selection});
  } else if (Math.hypot(dx,dy) < 8) emit({kind:'click',x:end[0],y:end[1]});
});
surface.addEventListener('pointercancel', () => { start=null; pointer=null; paint(selection); });
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
